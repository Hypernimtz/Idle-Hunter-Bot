name: Deploy bot

# On every push to main that touches the bot's source: run the test suites, upload the
# source files to the Hydrodactyl server over the panel API, then restart it.
# Never uploaded: token.env, *.db, config.json, lottery.json, runtime_state.json (live data).

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - "pending_updates.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-bot
  cancel-in-progress: false

permissions:
  contents: read

env:
  PANEL_HOST: https://panel.xsystemshosting.com
  SERVER_ID: 994c56ab
  # Optional repo variable BOT_DIR: the server folder that holds app.py. When unset (or wrong),
  # the deploy looks for app.py in /, /root and /home/container and uses the first match.
  BOT_DIR: ${{ vars.BOT_DIR || '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/test_v2.py
      - run: python tests/test_races.py
      - run: python tests/test_tribe_treasury.py
      - run: python tests/test_tribe_teamwork.py
      - run: python tests/test_combat_rules.py
      - run: python tests/test_hunt_balance.py
      - run: python tests/test_gamble_limits.py
      - run: python tests/test_events_v3.py
      - run: python tests/test_fight_duel.py
      - run: python tests/test_myth_fight.py
      - run: python tests/test_settings.py
      - run: python tests/test_giveaway.py
      - run: python tests/test_inspect.py
      - run: python tests/test_prefix.py
      - run: python tests/test_status.py
      - run: python tests/test_lifetime.py
      - run: python tests/test_profile.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the API key secret is set
        run: |
          if [ -z "$PANEL_API_KEY" ]; then
            echo "::error::Add the PANEL_API_KEY repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Find the server's API prefix
        # Hydrodactyl serves each server under /servers/wings/<id> or /servers/elytra/<id>
        # depending on its daemon type — probe both and keep the one that answers.
        run: |
          for kind in wings elytra; do
            api="$PANEL_HOST/api/client/servers/$kind/$SERVER_ID"
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $PANEL_API_KEY" \
              -H "Accept: application/json" "$api/resources")
            echo "$kind -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API=$api" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Neither daemon prefix answered 200 — check the API key's access to server $SERVER_ID."
          exit 1

      - name: Locate the bot folder on the server
        # Only ever overwrites a folder that already contains app.py — never creates a new copy.
        run: |
          for dir in "$BOT_DIR" / /root /home/container; do
            [ -n "$dir" ] || continue
            if curl -sS -G                 -H "Authorization: Bearer $PANEL_API_KEY"                 -H "Accept: application/json"                 --data-urlencode "directory=$dir"                 "$API/files/list" | jq -e '.data[]?.attributes | select(.name == "app.py")' > /dev/null; then
              echo "Found app.py in $dir"
              echo "TARGET_DIR=$dir" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "no app.py in $dir"
          done
          echo "::error::Could not find app.py on the server. Set the BOT_DIR repo variable to its folder."
          exit 1

      - name: Upload source files
        run: |
          for f in app.py backend.py game_data.py event_data.py event_scenes.py leaderboard_push.py pending_updates.json requirements.txt; do
            path="${TARGET_DIR%/}/$f"
            echo "Uploading $f -> $path"
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $PANEL_API_KEY" \
              -H "Accept: application/json" \
              -H "Content-Type: text/plain" \
              --data-binary "@$f" \
              "$API/files/write?file=$(printf '%s' "$path" | jq -sRr @uri)"
          done

      - name: Restart the server
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $PANEL_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"signal":"restart"}' \
            "$API/power"

      - name: Wait for the bot to come back up
        run: |
          for i in $(seq 1 24); do
            sleep 5
            state=$(curl -sS \
              -H "Authorization: Bearer $PANEL_API_KEY" \
              -H "Accept: application/json" \
              "$API/resources" | jq -r '.attributes.current_state // "unknown"')
            echo "state: $state"
            if [ "$state" = "running" ]; then exit 0; fi
          done
          echo "::error::Server did not reach 'running' within 2 minutes."
          exit 1
